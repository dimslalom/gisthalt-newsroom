<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>gisthalt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="gisthalt — an Indonesian-language newsroom for Formula 1, Valorant and Film/TV. Launching soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Libertinus Keyboard";
    src: url("fonts/LibertinusKeyboard-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f7f6f3;
    --ink: #171613;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Lexend Deca", -apple-system, sans-serif;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 24px;
    text-align: center;
    animation: rise 1.1s cubic-bezier(.16,1,.3,1) both;
  }

  .logo {
    font-size: clamp(48px, 11vw, 128px);
    line-height: 1;
    letter-spacing: -0.03em;
    white-space: nowrap;
    user-select: none;
  }

  .logo .g {
    font-family: "Libertinus Keyboard", serif;
    font-weight: 400;
  }

  .logo .rest {
    font-family: "Lexend Deca", sans-serif;
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .tagline {
    font-size: clamp(13px, 1.6vw, 16px);
    font-weight: 400;
    letter-spacing: -0.01em;
    color: color-mix(in srgb, var(--ink) 55%, transparent);
    max-width: 32ch;
  }

  .status {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 40%, transparent);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c98a3e;
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(.7); }
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0e0c; --ink: #f3f1ec; }
  }
</style>
</head>
<body>
<main>
  <h1 class="logo" aria-label="gisthalt">
    <span class="g">g</span><span class="rest">isthalt</span>
  </h1>
  <p class="tagline">An Indonesian-language newsroom for Formula&nbsp;1, Valorant and Film/TV.</p>
  <p class="status">Launching soon</p>
</main>
</body>
</html>
