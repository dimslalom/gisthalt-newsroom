<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="gisthalt is an independent media company building brands.">
  <meta name="theme-color" content="#f7f6f3">
  <title>gisthalt</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://gisthalt.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gisthalt.com/">
  <meta property="og:title" content="gisthalt">
  <meta property="og:description" content="gisthalt is an independent media company building brands.">
  <meta property="og:image" content="https://gisthalt.com/assets/social-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:alt" content="formula 1 cars racing around a circuit corner.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="gisthalt">
  <meta name="twitter:description" content="gisthalt is an independent media company building brands.">
  <meta name="twitter:image" content="https://gisthalt.com/assets/social-preview.jpg">
  <script>document.documentElement.classList.add('has-js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "Libertinus Keyboard";
      src: url("fonts/LibertinusKeyboard-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --canvas: #f7f6f3;
      --ink: #171613;
      --quiet: #706f6a;
      --viewport-height: 100vh;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Lexend Deca", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html.has-js .intro { opacity: 0; }
    html.has-js.is-lottie-frame-ready .intro { opacity: 1; }

    .intro {
      min-height: var(--viewport-height);
      height: var(--viewport-height);
      padding: clamp(2rem, 7vw, 5rem) clamp(1.5rem, 5vw, 3rem);
      display: grid;
      place-items: center;
      text-align: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .identity { width: min(100%, 48rem); }

    .wordmark {
      display: inline-flex;
      align-items: baseline;
      line-height: 1;
      font-size: clamp(3.5rem, 11vw, 8rem);
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    h1, h2, p { margin: 0; }

    .logo-g {
      position: relative;
      display: inline-block;
      top: -.24em;
      width: .82em;
      height: 1em;
      padding: 0;
      border: 0;
      appearance: none;
      background: transparent;
      color: inherit;
      font-size: inherit;
      line-height: 1;
      cursor: pointer;
      transform-origin: 50% 65%;
      transition: transform 130ms cubic-bezier(.2, .9, .3, 1), filter 130ms ease, text-shadow 130ms ease;
      animation: none;
    }

    .logo-fallback {
      display: block;
      font-family: "Libertinus Keyboard", Georgia, serif;
      font-size: inherit;
      font-weight: 400;
    }

    .logo-g canvas {
      position: absolute;
      top: -110%;
      left: -110%;
      width: 320%;
      height: 320%;
      opacity: 0;
      filter: brightness(0);
      backface-visibility: hidden;
      transition: none;
    }

    .logo-g.is-lottie-ready .logo-fallback { opacity: 0; }
    .logo-g.is-lottie-ready canvas { opacity: 1; }

    .logo-g:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: .12em;
      border-radius: .08em;
    }

    .logo-g:hover { filter: brightness(.72); }

    .logo-g:active,
    .logo-g.is-pressed {
      filter: brightness(.62);
      transform: translateY(.07em) scale(.965);
    }

    .logo-rest-wrap {
      display: inline-block;
      overflow: clip;
      padding: .12em .08em .12em 0;
      margin: -.12em -.08em -.12em .06em;
    }

    .logo-rest {
      display: inline-block;
      font-family: "Lexend Deca", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 600;
      animation: word-extends 760ms cubic-bezier(.16, 1, .3, 1) both;
    }

    html.has-js .logo-rest {
      animation-play-state: paused;
    }

    html.has-js .intro.is-wordmark-ready .logo-rest {
      animation-play-state: running;
    }

    .brand-takeover {
      min-height: var(--viewport-height);
      height: var(--viewport-height);
      background: #000;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .brand-stage {
      position: relative;
      min-height: 100%;
      height: 100%;
      overflow: clip;
      isolation: isolate;
      background: #000;
      color: #fff;
    }

    .brand-stage::before {
      position: absolute;
      z-index: 1;
      inset: 0;
      content: "";
      background: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, transparent 34%, rgba(0, 0, 0, .1) 56%, rgba(0, 0, 0, .88) 100%);
      pointer-events: none;
    }

    .track-image {
      position: absolute;
      inset: -12%;
      width: 124%;
      height: 124%;
      object-fit: cover;
      object-position: center;
    }

    .s3-mark {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      width: clamp(6.5rem, 15vw, 11rem);
      height: auto;
      transform: translate(-50%, -50%);
      transform-origin: center;
      opacity: 1;
      filter: drop-shadow(0 .4rem 1.5rem rgba(0, 0, 0, .5));
    }

    .brand-content {
      position: absolute;
      z-index: 3;
      right: clamp(2rem, 7vw, 5rem);
      bottom: clamp(2.5rem, 8vh, 5rem);
      left: clamp(2rem, 7vw, 5rem);
      display: grid;
      gap: .25rem;
      opacity: 1;
    }

    .brand-content h2 {
      font-family: "DIN Condensed", "DIN Alternate", "Arial Narrow", sans-serif;
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: .9;
    }

    .brand-content p,
    .brand-content a { font-size: clamp(1rem, 1.7vw, 1.25rem); }

    .brand-content p { color: rgba(255, 255, 255, .76); }

    .brand-content a {
      width: fit-content;
      color: #fff;
      text-decoration-thickness: 1px;
      text-underline-offset: .22em;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: .35rem;
      border-radius: .1rem;
    }

    @keyframes mark-arrives {
      from { opacity: 0; transform: translateY(.12em) scale(.72) rotate(-4deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes word-extends {
      from { opacity: 0; transform: translateX(-1.1em); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(.5rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      html.has-js .logo-rest { animation: none; opacity: 1; }
      .brand-takeover { min-height: 100vh; }
      .brand-stage { position: relative; min-height: 100%; }
      .s3-mark { opacity: 1; transform: translate(-50%, -50%); }
      .brand-content { opacity: 1; }
      .brand-content { transform: none; }
    }

    @media (max-width: 30rem) {
      .wordmark { font-size: clamp(3rem, 17.5vw, 4.25rem); }
      .brand-content h2 { font-size: clamp(2.8rem, 15vw, 4.5rem); }
    }

    @media (max-height: 32rem) and (orientation: landscape) {
      .intro { padding-block: 2rem; }
      .brand-takeover { min-height: 100vh; }
      .s3-mark { width: 4rem; }
      .brand-content { bottom: 2rem; }
    }

  </style>
</head>
<body>
  <main class="intro">
    <section class="identity" aria-labelledby="site-title">
      <h1 id="site-title" class="wordmark" aria-label="gisthalt">
        <button class="logo-g" type="button" aria-label="press gisthalt mark">
          <span class="logo-fallback" aria-hidden="true">g</span>
          <canvas id="gisthalt-logo-animation" aria-hidden="true"></canvas>
        </button><span class="logo-rest-wrap"><span class="logo-rest">isthalt</span></span>
      </h1>
    </section>
  </main>

  <section class="brand-takeover" aria-labelledby="sektortiga-title">
    <div class="brand-stage">
      <video class="track-image" autoplay muted loop playsinline preload="metadata" poster="assets/sektortiga-bg-1920.webp" aria-hidden="true">
        <source src="assets/sektortiga-track.mp4" type="video/mp4">
      </video>
      <img class="s3-mark" src="assets/s3-logo.png" alt="sektor tiga logo">
      <div class="brand-content">
        <h2 id="sektortiga-title">sektor tiga</h2>
        <p>formula 1, in indonesian.</p>
        <a href="https://www.instagram.com/sektortigaf1/" rel="external">@sektortigaf1</a>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const takeover = document.querySelector('.brand-takeover');
      const logoMark = document.querySelector('.logo-g');
      const setViewportHeight = () => {
        const height = window.visualViewport?.height || window.innerHeight;
        document.documentElement.style.setProperty('--viewport-height', `${Math.round(height)}px`);
      };
      let wheelIntent = 0;
      let navigating = false;

      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.visualViewport?.addEventListener('resize', setViewportHeight);

      window.addEventListener('wheel', (event) => {
        const onHome = window.scrollY < 2;
        const onBrand = Math.abs(window.scrollY - takeover.offsetTop) < 2;
        const direction = Math.sign(event.deltaY);

        if (navigating || (!onHome && !onBrand) || direction === 0) return;
        if ((onHome && direction < 0) || (onBrand && direction > 0)) return;

        event.preventDefault();
        wheelIntent += Math.abs(event.deltaY);

        if (wheelIntent < 48) return;
        navigating = true;
        wheelIntent = 0;
        (direction > 0 ? takeover : document.querySelector('.intro'))
          .scrollIntoView({ behavior: 'smooth', block: 'start' });
        window.setTimeout(() => { navigating = false; }, 650);
      }, { passive: false });

    })();
  </script>
  <script type="module">
    import { DotLottie } from 'https://esm.sh/@lottiefiles/dotlottie-web@0.80.0';

    const mark = document.querySelector('.logo-g');
    const intro = document.querySelector('.intro');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let wordmarkStarted = false;
    const startWordmark = () => {
      if (wordmarkStarted) return;
      wordmarkStarted = true;
      intro.classList.add('is-wordmark-ready');
    };
    const player = new DotLottie({
      canvas: document.querySelector('#gisthalt-logo-animation'),
      src: 'assets/gisthalt-logo.lottie',
      autoplay: false,
      loop: false,
      stateMachineId: 'StateMachine1',
      renderConfig: {
        devicePixelRatio: window.devicePixelRatio || 1,
        autoResize: true,
      },
    });

    player.addEventListener('load', () => {
      player.setLayout({ fit: 'cover', align: [0.5, 0.5] });
      player.resize();
      player.stateMachineLoad('StateMachine1');
      player.stateMachineStart();
      player.setFrame(0);
      mark.classList.add('is-lottie-ready');
      requestAnimationFrame(() => {
        document.documentElement.classList.add('is-lottie-frame-ready');
        requestAnimationFrame(() => {
          startWordmark();
          if (!prefersReducedMotion) player.postStateMachineEvent('toggleEvent');
        });
      });
    });
    window.setTimeout(startWordmark, 900);
    mark.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        player.postStateMachineEvent('toggleEvent');
      }
    });
  </script>
</body>
</html>
